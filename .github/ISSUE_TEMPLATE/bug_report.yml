name: Bug report
description: Report a reproducible problem with the skill or helper
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include customer data, credentials, cookies, OTPs, payment details, or booking confirmations.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Agent runtime, operating system, Python version, and Treatwell locale.
      placeholder: Codex, macOS, Python 3.11, treatwell.at
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, what did you expect, and which fallback was attempted?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic or sanitized fixture data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Optional output with all personal, session, and payment data removed.
      render: shell
